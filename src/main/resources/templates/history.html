<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title> Weather History</title>

    <!-- Optional: Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #e3f2fd;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            max-width: 800px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: #fff;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px 15px;
        }

        th {
            background: #2196f3;
            color: white;
            text-transform: uppercase;
        }

        td {
            background: #f0f8ff;
        }

        tr:hover td {
            background: #e1f5fe;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2196f3;
            font-weight: bold;
            padding: 8px 15px;
            border: 1px solid #2196f3;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #2196f3;
            color: white;
        }
    </style>
</head>
<body>

<h1> Weather History</h1>

<table>
    <thead>
    <tr>
        <th>City</th>
        <th>Temperature (°C)</th>
        <th>Humidity (%)</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="w : ${history}">
        <td th:text="${w.city}">City</td>
        <td th:text="${w.temperature}">Temp</td>
        <td th:text="${w.humidity}">Humidity</td>
        <td th:text="${w.description}">Description</td>
    </tr>
    </tbody>
</table>

<a href="/">⬅ Back</a>

</body>
</html>
